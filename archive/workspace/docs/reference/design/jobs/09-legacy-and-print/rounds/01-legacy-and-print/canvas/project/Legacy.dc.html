</div></div>

    if (this.watched && els.length === this.watched.length && els.every((e, i) => e === this.watched[i])) return;
    this.ro.disconnect(); els.forEach((e) => this.ro.observe(e)); this.watched = els;
  }
  /* Larger text, zoom or a short window: the document keeps at least min(40% of the page, 17rem). When the bottom

    const bar = q('.lg-bottom__bar'), top = q('.lg-topbox');
    let tight = false;

      const chap = q('.lg-chap'), sb = q('.lg-safe--b'), st = q('.lg-safe--t');

      const room = H - top.offsetHeight - (st ? st.offsetHeight : 0) - chrome;

  componentDidUpdate(prev) {

    if (jt !== pjt || moved || (P.status === 'ready' && prev.status !== 'ready')) {

      this.sent = { pct: -10, anchor: undefined, at: '' };

    if ((P.bar || 'shown') !== (prev.bar || 'shown')) this.rebase = true;

  applyJump(focus) {

      const box = this.docEl;

  anchorOf() {

  /* What the bridge posts: { kb: "legacy", v: 1, type: "scroll", fraction, anchor }, throttled. */
  measure() {
    const P = this.props;

    const frac = this.fracOf(), anchor = this.anchorOf();
    if (Math.abs(frac - this.state.frac) > 0.0005 || anchor !== this.state.anchor) this.setState({ frac, anchor });
    const pct = Math.round(frac * 100);

      P.onReading({ frac, anchor });
    }
    const seen = frac >= 0.95;
    if (seen && !this.endIn) { this.endIn = true; if (P.onEnd) P.onEnd(); }
    else if (!seen && this.endIn) { this.endIn = false; if (P.onEndLeft) P.onEndLeft(); }
  }
  /* The bar's rules, from the fraction alone (the bridge reports no taps):
     shown at the top and at the end, and it stays at the end until the reader scrolls back up; hidden on a scroll down;
     shown on a scroll up of 0.2% of the document or more. Quiet for 450 ms after a restore, and while a sheet is open.
     After the bar hides or shows, the frame's height changes and so does the fraction: the next message only re-sets the
     baseline. */
  onScroll = () => {

      if (f >= 0.995) { want = 'shown'; this.endLock = true; }
      else if (f <= 0.0005) want = 'shown';
      else if (this.rebase) this.rebase = false;
      else if (df < -0.002) { want = 'shown'; this.endLock = false; }
      else if (df > 0.0005 && !this.endLock) want = 'hidden';

  };
  onAnchor = (id) => {
    const box = this.docEl;
    if (!box) return;
    const el = box.querySelector('[id="' + id + '"]');
    if (!el) return;
    box.scrollTop = Math.max(0, Math.round(el.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop - 12));
  };

      this.props.onPanel(null);
    }

    const t0 = Date.now();

      const b = this.frame && this.frame.querySelector('.rd-sheet__close');
      if (b) b.focus({ preventScroll: true });
      else if (Date.now() - t0 < 1500) requestAnimationFrame(go);
    };
    requestAnimationFrame(go);
  }

    const prog = P.prog || RD.progress;

    const g = LG.read(doc, P.lang || 'en', P.ver);
    if (!g) status = 'notfound';
    const r = g ? g.r : null;
    const ctx = RD.ctx(doc) || { loose: true, total: 0, n: 0 };
    const loose = !!ctx.loose;
    const lang = r ? r.lang : 'en';
    const panel = P.panel || null;
    const ready = status === 'ready';
    const theme = P.theme || 'light';
    const botHidden = (P.bar || 'shown') === 'hidden' && ready;
    const frac = ready ? this.state.frac : 0;
    const pct = ready ? Math.round(frac * 100) : 0;

    const prevKey = !loose && ctx.prev, nextKey = !loose && ctx.next;

    const tNext = nextKey ? RD.titleOf(nextKey, lang) : { text: '', lang: 'en' };
    const done = loose ? 0 : RD.finishedCount(ctx.bookKey, prog);
    const look = (RD.docs[doc] && RD.docs[doc].look) || 'light';

      frameStyle: safe ? '--lg-safe-t: 47px; --lg-safe-b: 34px; --rd-barvis: 47px' : '--rd-barvis: 0px',
      theme, themeChoice: P.themeChoice || 'system', os: P.os || 'light', look,

      backLong: loose ? 'Library' : ctx.bookTitle,
      backShort: loose ? 'Library' : 'Book',
      isOld: !!(r && r.isOld && ready),
      version: r ? r.version : 1,
      newest: r ? r.newest : 1,
      date: r ? r.date : '',

      hasPrompt: !!P.prompt && !member && ready,

      finishPrompt: P.prompt === 'finish' && !member,
      n: ctx.n || 0, total: ctx.total || 0,

      bookTitle: loose ? '' : ctx.bookTitle,

      sheetOpen: !!panel,
      isContents: panel === 'contents' && !loose && !!g,
      isDisplay: panel === 'display',
      isVersions: panel === 'versions' && !!g,
      onOpen: P.onOpen,
      onLang: P.onLang,
      onVersion: P.onVersion,
      onTheme: P.onTheme,
      onMark: P.onMark,
      onRetry: P.onRetry,
      onDocLink: (to) => { if (P.onLink) P.onLink(to); },
      onAnchor: this.onAnchor,

      openVersions: () => { if (P.onPanel) P.onPanel('versions'); },
      closePanel: call(() => { if (P.onPanel) P.onPanel(null); }),
      readLatest: () => { if (P.onVersion && r) P.onVersion(r.newest); },
      readSource: () => { if (P.onLang && g && g.srcLang) P.onLang(g.srcLang); },
      showBar: () => { if (P.onBar) P.onBar('shown'); },
      fromTop: () => { if (P.onFromTop) P.onFromTop(); },
      dismissPrompt: () => { if (P.onPrompt) P.onPrompt(null); },
      skipToDoc: (e) => { if (e && e.preventDefault) e.preventDefault(); if (this.docEl) { this.setState({ quiet: undefined }); this.docEl.focus({ preventScroll: true }); } },
      onDocBlur: () => { if (this.state.quiet) this.setState({ quiet: undefined }); },
      onKey: this.onKey,
      onScroll: this.onScroll,
      setDoc: this.setDoc,
      setFrame: this.setFrame,

  }
}
</script>
