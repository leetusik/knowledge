<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The chapter bar, as signed</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kb/tokens.css">
<link rel="stylesheet" href="frame.css">
</head>
<body>
<x-dc>
<div class="{{ wrapCls }}" data-theme="{{ wrapTheme }}">
<nav class="rd-bottom" aria-label="Chapters">
<div class="rd-bottom__cell">
<sc-if value="{{ hasPrev }}" hint-placeholder-val="{{ true }}"><a class="rd-bnav rd-bnav--prev" href="{{ prevHref }}" onclick="{{ prev }}"><span class="rd-bnav__dir"><span class="rd-bnav__chev" aria-hidden="true">‹</span> Previous</span><span class="rd-bnav__mark" aria-hidden="true">‹</span><span class="rd-bnav__sub">{{ prevTitle }}</span></a></sc-if>
</div>
<button type="button" class="rd-bnav rd-bnav--mid" aria-haspopup="dialog" aria-expanded="false" onclick="{{ contents }}"><span class="rd-bnav__dir">Contents</span><span class="rd-bnav__sub">{{ where }}</span><span class="rd-bnav__count" aria-hidden="true">{{ count }}</span></button>
<div class="rd-bottom__cell rd-bottom__cell--end">
<sc-if value="{{ hasNext }}" hint-placeholder-val="{{ true }}"><a class="rd-bnav rd-bnav--next" href="{{ nextHref }}" onclick="{{ next }}"><span class="rd-bnav__dir">Next →</span><span class="rd-bnav__mark" aria-hidden="true">→</span><span class="rd-bnav__sub">{{ nextTitle }}</span></a></sc-if>
<sc-if value="{{ isLast }}" hint-placeholder-val="{{ false }}"><a class="rd-bnav rd-bnav--next" href="{{ bookHref }}" onclick="{{ book }}"><span class="rd-bnav__dir"><span class="rd-bnav__long">Back to the book →</span><span class="rd-bnav__short">The book →</span></span><span class="rd-bnav__mark" aria-hidden="true">→</span><span class="rd-bnav__sub">knowledge maintainer guide</span></a></sc-if>
</div>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"n":{"editor":"int","default":2},"total":{"editor":"int","default":5},"pct":{"editor":"range","min":0,"max":100,"step":1,"default":12},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"titles":{"editor":null},"prevHref":{"editor":null},"nextHref":{"editor":null},"bookHref":{"editor":null},"onPrev":{"editor":null},"onNext":{"editor":null},"onContents":{"editor":null},"onBook":{"editor":null},"bare":{"editor":null},"$preview":{"width":1200,"height":61}}'>
class Component extends DCLogic {
  call(name) {
    return (e) => {
      const f = this.props[name];
      if (f) { if (e && e.preventDefault) e.preventDefault(); f(); }
    };
  }
  renderVals() {
    const P = this.props;
    const bare = !!P.bare;
    const T = P.titles || [
      'knowledge: what it is and how it is used',
      'System internals: the content plane, the write path and the contracts',
      'knowledge’s read surfaces: two front ends, one corpus',
      'Shipping and running knowledge: distribution, the edge, security and the gates',
      'Why knowledge is this way, and how to change it',
    ];
    const total = P.total || T.length;
    const n = Math.max(1, Math.min(total, P.n || 2));
    const pct = P.pct === undefined ? 12 : P.pct;
    return {
      hasPrev: n > 1,
      hasNext: n < total,
      isLast: n === total,
      prevTitle: T[n - 2] || '',
      nextTitle: T[n] || '',
      where: 'Chapter ' + n + ' of ' + total + ' · ' + pct + '%',
      count: n + ' of ' + total,
      prevHref: P.prevHref || '#top',
      nextHref: P.nextHref || '#top',
      bookHref: P.bookHref || '#top',
      prev: this.call('onPrev'),
      next: this.call('onNext'),
      contents: this.call('onContents'),
      book: this.call('onBook'),
      wrapCls: bare ? 'rd-in' : 'rd-frame',
      wrapTheme: bare ? undefined : (P.theme === 'dark' ? 'dark' : 'light'),
    };
  }
}
</script>
</body>
</html>
