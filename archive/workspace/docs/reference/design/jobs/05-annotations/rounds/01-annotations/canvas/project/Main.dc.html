<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reader — the flow</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kb/tokens.css">
<link rel="stylesheet" href="reader.css">
<link rel="stylesheet" href="annot.css">
<script src="reader.js"></script>
<script src="annot.js"></script>
<script src="flow.js"></script>
</head>
<body>
<x-dc>
<div class="rd-proto">
<div class="rd-proto__stage">
<sc-if value="{{ inReader }}" hint-placeholder-val="{{ true }}"><dc-import name="Reader" fit="fill" bar="{{ groups }}" doc="{{ r.doc }}" lang="{{ r.lang }}" ver="{{ r.ver }}" theme="{{ r.theme }}" theme-choice="{{ r.themeChoice }}" os="{{ r.os }}" size="{{ r.size }}" member="{{ r.member }}" chrome="{{ r.chrome }}" panel="{{ r.panel }}" status="{{ r.status }}" prog="{{ r.prog }}" jump="{{ r.jump }}" prompt="{{ r.prompt }}" resumed="{{ r.resumed }}" ver-fail="{{ r.verFail }}" hold="{{ r.hold }}" an="{{ r.an }}" on-open="{{ r.onOpen }}" on-lang="{{ r.onLang }}" on-version="{{ r.onVersion }}" on-theme="{{ r.onTheme }}" on-size="{{ r.onSize }}" on-panel="{{ r.onPanel }}" on-chrome="{{ r.onChrome }}" on-mark="{{ r.onMark }}" on-end="{{ r.onEnd }}" on-end-left="{{ r.onEndLeft }}" on-reading="{{ r.onReading }}" on-away="{{ r.onAway }}" on-retry="{{ r.onRetry }}" on-prompt="{{ r.onPrompt }}" on-from-top="{{ r.onFromTop }}" on-dismiss-resume="{{ r.onDismissResume }}" hint-size="100%,900px"></dc-import></sc-if>
<sc-if value="{{ inBook }}" hint-placeholder-val="{{ false }}"><dc-import name="BookNotes" fit="fill" bar="{{ groups }}" ann="{{ b.ann }}" filter="{{ b.filter }}" edit-label="{{ b.editLabel }}" theme="{{ b.theme }}" size="{{ b.size }}" scroll-token="{{ b.scrollToken }}" toast="{{ b.toast }}" on-undo="{{ b.onUndo }}" on-back="{{ b.onBack }}" on-logo="{{ b.onLogo }}" on-go="{{ b.onGo }}" on-delete="{{ b.onDelete }}" on-label="{{ b.onLabel }}" on-save-label="{{ b.onSaveLabel }}" on-cancel-label="{{ b.onCancelLabel }}" on-filter="{{ b.onFilter }}" hint-size="100%,900px"></dc-import></sc-if>
<sc-if value="{{ isAway }}" hint-placeholder-val="{{ false }}"><dc-import name="Elsewhere" fit="fill" bar="{{ groups }}" kind="{{ w.kind }}" where="{{ w.where }}" detail="{{ w.detail }}" legacy-title="{{ w.legacyTitle }}" legacy-bm="{{ w.legacyBm }}" member="{{ w.member }}" on-legacy-bm="{{ w.onLegacyBm }}" on-sign-in="{{ w.onSignIn }}" on-back="{{ w.onBack }}" on-continue="{{ w.onContinue }}" hint-size="100%,900px"></dc-import></sc-if>
</div>
<div data-proto="screens"><span>Canvas only ·</span><a href="Reader.dc.html">The chapter screen alone</a><a href="BookNotes.dc.html">Notes in this book, alone</a><a href="Widths.dc.html">The reader at 390, 820, 1024 and 1440</a><a href="Elsewhere.dc.html">The stand-in for another job's screen</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":929}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = window.RD.flow.initial('top', { themeChoice: 'system', size: 3 });
    this.a = window.RD.flow.api(this);
  }
  renderVals() {
    const F = window.RD.flow, s = this.state;
    const none = { kind: 'library', where: '', detail: '', legacyTitle: '', legacyBm: false, member: true, onLegacyBm: null, onSignIn: null, onBack: null, onContinue: null };
    const inBook = !s.away && s.view === 'booknotes';
    return {
      groups: F.bar(this, this.a),
      inReader: !s.away && !inBook,
      inBook,
      isAway: !!s.away,
      r: F.readerProps(this, this.a),
      b: F.bookProps(this, this.a),
      w: s.away ? F.awayProps(this, this.a) : none,
    };
  }
}
</script>
</body>
</html>
