<script type="text/x-dc" data-dc-script data-props='{"block":{"editor":null},"state":{"editor":null},"rm":{"editor":null},"lang":{"editor":null},"onLink":{"editor":null},"bare":{"editor":null},"theme":{"editor":null},"size":{"editor":null},"$preview":{"width":820,"height":520}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tick: 0, over: false, moreL: false, moreR: false }; this.box = null; this.ro = null; }

  linkClick = (e) => {
    const to = e.currentTarget.getAttribute('data-to');
    if (!this.props.onLink) { if (e.currentTarget.getAttribute('href') === '#top') e.preventDefault(); return; }
    e.preventDefault();
    this.props.onLink(to);
  };
  /* A citation: the source item becomes the target (the product's :target), then the reader's own anchor jump. */
  citeClick = (e) => {
    const to = e.currentTarget.getAttribute('data-to');
    e.preventDefault();
    if (!this.props.bare) return;
    if (window.RD.figs) window.RD.figs.go({ target: to.slice(1), here: '' });
    if (this.props.onLink) this.props.onLink(to);
  };
  /* Canvas only: a part shown alone on a Components board has no chapter around it, so its in-chapter links
     (#id, a citation) point at #top there and do nothing; data-to keeps the real target. In the reader they go. */
  loc(o) {
    if (this.props.bare) return o;
    const walk = (x) => {
      if (Array.isArray(x)) return x.map(walk);
      if (!x || typeof x !== 'object') return x;
      const n = {};
      for (const k in x) n[k] = (k === 'svg' || k === 'a') ? x[k] : walk(x[k]);
      if ((n.isLink || n.isCite) && typeof n.href === 'string' && n.href.charAt(0) === '#' && n.href !== '#top') n.href = '#top';
      return n;
    };
    return walk(o);
  }
  componentDidMount() {
    const F = window.RD.figs;
    if (F) this.unsub = F.sub(() => this.setState({ tick: (this.state.tick || 0) + 1 }));
    if (this.check && document.fonts && document.fonts.ready) document.fonts.ready.then(() => this.check());
  }
  componentWillUnmount() {
    if (this.unsub) this.unsub();
    if (this.ro) this.ro.disconnect();
    if (this.box) this.box.removeEventListener('scroll', this.onScroll);
  }
  wrap(rm) {
    const P = this.props, bare = !!P.bare;
    return {
      wrapCls: (bare ? 'rd-pass' : 'rd-frame rd-size-' + (P.size || 3) + ' rd-standalone') + (rm ? ' fg-rm' : ''),
      wrapTheme: bare ? undefined : (P.theme || 'light'),
      flowCls: bare ? 'fg-pass' : 'rd-flow fg-solo',
      lang: bare ? (P.lang || undefined) : (P.lang || 'en'),
      linkClick: this.linkClick,
      citeClick: this.citeClick,
    };
  }

  /* Wider than its box (a wide image below 36rem, a drawing whose labels would shrink under 11 px), the box scrolls and
     says so, as the signed reader's drawings and tables do (its 9a): measured, and re-measured on resize and when fonts
     load. Each fade shows only on a side where more remains. */
  setBox = (el) => {
    if (this.ro) { this.ro.disconnect(); this.ro = null; }
    if (this.box) this.box.removeEventListener('scroll', this.onScroll);
    this.box = el;
    if (el) el.addEventListener('scroll', this.onScroll, { passive: true });
    if (el && window.ResizeObserver) { this.ro = new ResizeObserver(() => this.check()); this.ro.observe(el); if (el.firstElementChild) this.ro.observe(el.firstElementChild); }
    this.check();
  };
  edges(el) {
    const max = el.scrollWidth - el.clientWidth;
    return { moreL: max > 1 && el.scrollLeft > 1, moreR: max > 1 && el.scrollLeft < max - 1 };
  }
  onScroll = () => {
    const el = this.box;
    if (!el) return;
    const e = this.edges(el);
    if (e.moreL !== this.state.moreL || e.moreR !== this.state.moreR) this.setState(e);
  };
  check() {
    const el = this.box;
    if (!el) return;
    const over = el.scrollWidth > el.clientWidth + 1;
    const e = this.edges(el);
    if (over !== this.state.over || e.moreL !== this.state.moreL || e.moreR !== this.state.moreR) this.setState(Object.assign({ over }, e));
  }
  overCls(on) {
    const s = this.state;
    return on && s.over ? ' is-over' + (s.moreL ? ' is-more-l' : '') + (s.moreR ? ' is-more-r' : '') : '';
  }

  renderVals() {
    const RD = window.RD, P = this.props;
    const F = RD.figs ? RD.figs.get() : { img: 'loaded', rm: false, miss: '' };
    const b = this.loc(P.block || RD.read('maintainer-guide/read-surfaces', 'en').blocks.find((x) => x.id === 'reader-desktop'));
    const a = b.a || { w: 4, h: 3, file: '' };
    /* loaded | loading | missing: a board passes it; in the flow it is the prototype's condition (RD.figs) */
    const state = P.state || (!b.known ? 'missing' : (F.miss && F.miss === b.src) ? 'missing' : (F.img || 'loaded'));
    const rm = P.rm === undefined || P.rm === null ? !!F.rm : !!P.rm;
    const isItem = b.kind === 'item', isPlain = b.kind === 'plain', isFig = !isItem && !isPlain;
    const wide = isFig && !!b.wide;
    const over = wide && this.state.over;
    return Object.assign(this.wrap(rm), {
      b, a, isFig, isItem, isPlain, wide,
      isLoaded: state === 'loaded', isLoading: state === 'loading', isMissing: state === 'missing',
      imgSrc: a.anim && rm ? a.still : a.file,
      stillSet: a.anim ? a.still : undefined,
      anim: !!a.anim,
      mediaStyle: '--fg-w: ' + a.w + '; --fg-h: ' + a.h,
      figCls: 'fg-fig' + (wide ? ' fg-fig--wide' : '') + this.overCls(wide),
      idAttr: b.id || undefined,
      setBox: this.setBox,
      tab: over ? 0 : undefined,
      role: over ? 'region' : undefined,
      boxAria: over ? 'Image, scrolls sideways' : undefined,
      busy: state === 'loading' ? 'true' : undefined,
    });
  }
}
