<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Table</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kb/tokens.css">
<link rel="stylesheet" href="reader.css">
<script src="reader.js"></script>
</head>
<body>
<x-dc>
<div class="{{ wrapCls }}" data-theme="{{ wrapTheme }}">
<div class="rd-table {{ kindCls }}">
<div class="rd-table__wrap"><div class="rd-table__scroll" tabindex="{{ tab }}" role="{{ role }}" aria-label="{{ aria }}"><table class="rd-t"><thead><tr><sc-for list="{{ b.head }}" as="h" hint-placeholder-count="4"><th scope="col" class="{{ h.cls }}">{{ h.v }}</th></sc-for></tr></thead><tbody><sc-for list="{{ b.rows }}" as="row" hint-placeholder-count="4"><tr><sc-for list="{{ row.cells }}" as="c" hint-placeholder-count="4"><td class="{{ c.cls }}"><sc-for list="{{ c.runs }}" as="r" hint-placeholder-count="3"><sc-if value="{{ r.isText }}" hint-placeholder-val="{{ true }}">{{ r.v }}</sc-if><sc-if value="{{ r.isEm }}" hint-placeholder-val="{{ false }}"><em>{{ r.v }}</em></sc-if><sc-if value="{{ r.isStrong }}" hint-placeholder-val="{{ false }}"><strong>{{ r.v }}</strong></sc-if><sc-if value="{{ r.isDel }}" hint-placeholder-val="{{ false }}"><del>{{ r.v }}</del></sc-if><sc-if value="{{ r.isCode }}" hint-placeholder-val="{{ false }}"><code class="rd-ic">{{ r.v }}</code></sc-if><sc-if value="{{ r.isLink }}" hint-placeholder-val="{{ false }}"><a class="rd-a" href="{{ r.href }}" data-to="{{ r.to }}" onclick="{{ linkClick }}">{{ r.v }}</a></sc-if><sc-if value="{{ r.isExt }}" hint-placeholder-val="{{ false }}"><a class="rd-a" href="#top" data-to="{{ r.to }}" onclick="{{ linkClick }}">{{ r.v }}<span class="rd-a__ext"> · new tab</span></a></sc-if><sc-if value="{{ r.isMissing }}" hint-placeholder-val="{{ false }}"><span class="rd-missing">{{ r.v }}</span></sc-if></sc-for></td></sc-for></tr></sc-for></tbody></table></div><sc-if value="{{ scrolls }}" hint-placeholder-val="{{ false }}"><span class="rd-table__fade" aria-hidden="true"></span></sc-if></div>
<sc-if value="{{ scrolls }}" hint-placeholder-val="{{ false }}"><p class="rd-table__hint">{{ hint }}</p></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"block":{"editor":null},"onLink":{"editor":null},"bare":{"editor":null},"theme":{"editor":null},"size":{"editor":null},"$preview":{"width":820,"height":485}}'>
class Component extends DCLogic {
  linkClick = (e) => {
    const to = e.currentTarget.getAttribute('data-to');
    if (!this.props.onLink) return;
    e.preventDefault();
    this.props.onLink(to);
  };
  renderVals() {
    const RD = window.RD;
    const b = this.props.block || RD.read('maintainer-guide/internals', 'en').blocks.find((x) => x.isTable && x.wide);
    const bare = !!this.props.bare;
    const kind = b.wide ? 'rd-table--wide' : b.long ? 'rd-table--long' : '';
    return {
      b,
      kindCls: kind,
      scrolls: !!(b.wide || b.long),
      hint: b.wide ? 'Scroll sideways for all ' + b.cols + ' columns →' : 'Scroll in the table for all ' + b.rows.length + ' rows and ' + b.cols + ' columns',
      tab: b.wide || b.long ? 0 : undefined,
      role: b.wide || b.long ? 'region' : undefined,
      aria: b.wide ? 'Table, ' + b.cols + ' columns, scrolls sideways' : b.long ? 'Table, ' + b.cols + ' columns, ' + b.rows.length + ' rows' : undefined,
      linkClick: this.linkClick,
      wrapCls: bare ? 'rd-pass' : 'rd-frame rd-size-' + (this.props.size || 3) + ' rd-standalone rd-pad',
      wrapTheme: bare ? undefined : (this.props.theme || 'light'),
    };
  }
}
</script>
</body>
</html>
