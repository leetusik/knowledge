# vocky.conf — vocky.hi2vi.com, now a REDIRECT-ONLY host.
#
# WHAT THIS IS: Feedback (formerly vocky) moved into the platform on the apex,
# https://hi2vi.com (deploy/hi2vi.conf serves it). This vhost proxies NOTHING — there
# is no vocky-api or vocky-web upstream any more. Every request answers with a
# 308 Permanent Redirect to the apex (or a 404 for /admin/), per this map:
#
#     /mcp, /mcp/      -> https://hi2vi.com/feedback/mcp       (the capture MCP)
#     /SKILL.md        -> https://hi2vi.com/feedback/SKILL.md  (the agent skill)
#     /install.sh      -> https://hi2vi.com/feedback/SKILL.md  (the CLI and its installer are retired)
#     /projects/<id>   -> https://hi2vi.com/dashboard          (vocky's project ids do not survive the merge)
#     /admin/...       -> 404                                  (never exposed, as before)
#     = /              -> https://hi2vi.com/feedback
#     anything else    -> https://hi2vi.com<the same path>     (/api/feedback*, /api/project/*,
#                                                               /app/feedback*, /feedback*, /login,
#                                                               /signup, /dashboard, /auth/*, ...)
#
# The query string is kept on every row, and :80 answers with the SAME map in one
# hop (an http:// request goes straight to the apex target). 308, not 301: it keeps
# the method and the body (RFC 9110 §15.4.9), so a POST capture stays a POST.
# Cloudflare in front passes the origin's 308 through unchanged. Old vk_ keys stop
# working after the move anyway, so the redirects carry people, bookmarks and docs,
# not live integrations.
#
# WHERE IT LANDS: /home/opc/edge/conf.d/vocky.conf on the box — the dedicated edge
# (compose project `edge` at /home/opc/edge, container `edge-nginx`, owner of :80 +
# :443). It replaces the edge repo's `edge/conf.d/vocky.conf` (its canonical home)
# and lands THROUGH THE EDGE REPO, by the operator, with the edge's own loop
# (./validate.sh -> bash stage.sh -> ./deploy.sh on the box), and ONLY once
# https://hi2vi.com serves the platform with Feedback in it. See deploy/README.md §3.
#
# HOUSE RULES — the conf.d/ tree is tested and reloaded AS A UNIT, so breaking one
# of these breaks EVERY site on the edge, not just this one:
#   * NEVER default_server. 00-default.conf owns the :80 and :443 catch-alls
#     (unknown Host -> 444). This vhost routes by Host/SNI only.
#   * NO IPv6 `listen [::]:...`. No sibling conf listens on v6, so adding it here
#     would silently make THIS vhost the default server for all v6 traffic.
#   * NO limit_req_zone: its zone NAME is global across conf.d/, and a duplicate is
#     a hard `nginx -t` failure for every site. A redirect host needs none.
#
# ROUTING: an exact `=` match wins first, then the longest prefix (there are no
# regex locations here), so `= /` only catches the bare root and `location /`
# catches everything the rows above do not. The two server blocks carry the same
# locations; change them together.

# =====================================================================
# :80 — the same map as :443, so an http:// request reaches its target in one hop.
# =====================================================================
server {
    listen 80;
    server_name vocky.hi2vi.com;

    location = / {
        return 308 https://hi2vi.com/feedback$is_args$args;
    }
    location = /mcp {
        return 308 https://hi2vi.com/feedback/mcp$is_args$args;
    }
    location = /mcp/ {
        return 308 https://hi2vi.com/feedback/mcp$is_args$args;
    }
    location = /SKILL.md {
        return 308 https://hi2vi.com/feedback/SKILL.md$is_args$args;
    }
    # Decided: the vocky CLI and its installer are retired, so the old installer
    # URL lands on the skill, which captures over REST or MCP (both server blocks).
    location = /install.sh {
        return 308 https://hi2vi.com/feedback/SKILL.md$is_args$args;
    }
    location /projects/ {
        return 308 https://hi2vi.com/dashboard$is_args$args;
    }
    location /admin/ {
        return 404;
    }
    location / {
        return 308 https://hi2vi.com$request_uri;
    }
}

# =====================================================================
# :443 — terminate TLS, then the map.
# =====================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name vocky.hi2vi.com;

    # TLS: the edge's Cloudflare Origin CA cert for hi2vi, SANs
    # `DNS:*.hi2vi.com, DNS:hi2vi.com` — the wildcard covers vocky.hi2vi.com.
    ssl_certificate     /etc/nginx/certs/hi2vi.crt;
    ssl_certificate_key /etc/nginx/certs/hi2vi.key;

    # Cloudflare real-IP restore, so the access log shows who still uses this host.
    # The same list the sibling confs carry (https://www.cloudflare.com/ips/);
    # refresh them together, never one file alone.
    # IPv4:
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    # IPv6:
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # HSTS — house style: short max-age, NO preload. `always` puts it on the 308 too.
    add_header Strict-Transport-Security "max-age=300" always;

    location = / {
        return 308 https://hi2vi.com/feedback$is_args$args;
    }
    location = /mcp {
        return 308 https://hi2vi.com/feedback/mcp$is_args$args;
    }
    location = /mcp/ {
        return 308 https://hi2vi.com/feedback/mcp$is_args$args;
    }
    location = /SKILL.md {
        return 308 https://hi2vi.com/feedback/SKILL.md$is_args$args;
    }
    # Decided: the vocky CLI and its installer are retired, so the old installer
    # URL lands on the skill, which captures over REST or MCP (both server blocks).
    location = /install.sh {
        return 308 https://hi2vi.com/feedback/SKILL.md$is_args$args;
    }
    location /projects/ {
        return 308 https://hi2vi.com/dashboard$is_args$args;
    }
    location /admin/ {
        return 404;
    }
    location / {
        return 308 https://hi2vi.com$request_uri;
    }
}
