<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The reader's top bar, as signed</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kb/tokens.css">
<link rel="stylesheet" href="frame.css">
</head>
<body>
<x-dc>
<div class="{{ wrapCls }}" data-theme="{{ wrapTheme }}" id="{{ rootId }}"><div class="rd-in">
<div class="rd-line" aria-hidden="true"><span class="rd-line__fill" style="{{ fillStyle }}"></span></div>
<header class="rd-top">
<div class="rd-top__start">
<a class="rd-logo" href="{{ homeHref }}" aria-label="knowledge library" onclick="{{ logo }}"><img src="assets/logo.svg" alt="" width="22" height="22"></a>
<a class="rd-back" href="{{ backHref }}" onclick="{{ back }}"><span class="rd-back__chev" aria-hidden="true">‹</span><span class="rd-back__long">{{ backLong }}</span><span class="rd-back__short">{{ backShort }}</span></a>
</div>
<div class="rd-top__end">
<sc-if value="{{ hasLangs }}" hint-placeholder-val="{{ true }}"><div class="rd-lang" role="group" aria-label="Language"><sc-for list="{{ langs }}" as="l" hint-placeholder-count="2"><button type="button" class="rd-lang__opt" lang="{{ l.code }}" aria-pressed="{{ l.pressed }}" onclick="{{ l.pick }}">{{ l.label }}</button></sc-for></div></sc-if>
<button type="button" class="rd-tbtn" aria-haspopup="dialog" aria-expanded="false" onclick="{{ display }}">Display</button>
</div>
</header>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["en","ko"],"default":"en"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"pct":{"editor":"range","min":0,"max":100,"step":1,"default":38},"backLong":{"editor":null},"backShort":{"editor":null},"langs":{"editor":null},"homeHref":{"editor":null},"backHref":{"editor":null},"onBack":{"editor":null},"onLogo":{"editor":null},"onLang":{"editor":null},"onDisplay":{"editor":null},"bare":{"editor":null},"$preview":{"width":1200,"height":59}}'>
class Component extends DCLogic {
  call(name, arg) {
    return (e) => {
      const f = this.props[name];
      if (f) { if (e && e.preventDefault) e.preventDefault(); f(arg); }
    };
  }
  renderVals() {
    const P = this.props;
    const bare = !!P.bare;
    const pct = Math.max(0, Math.min(100, P.pct === undefined ? 38 : P.pct));
    const langs = P.langs === undefined ? ['en', 'ko'] : P.langs;
    const cur = P.lang === 'ko' ? 'ko' : 'en';
    const LABEL = { en: 'English', ko: '한국어' };
    return {
      fillStyle: 'width: ' + pct + '%',
      backLong: P.backLong || 'Our bar: performance rule v1',
      backShort: P.backShort || 'Book',
      hasLangs: langs.length > 1,
      langs: langs.map((code) => ({ code, label: LABEL[code] || code, pressed: code === cur ? 'true' : 'false', pick: this.call('onLang', code) })),
      homeHref: P.homeHref || '#top',
      backHref: P.backHref || '#top',
      logo: this.call('onLogo'),
      back: this.call('onBack'),
      display: this.call('onDisplay'),
      wrapCls: bare ? 'rd-in' : 'rd-frame rd-in',
      wrapTheme: bare ? undefined : (P.theme === 'dark' ? 'dark' : 'light'),
      rootId: bare ? undefined : 'top',
    };
  }
}
</script>
</body>
</html>
