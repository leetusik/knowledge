<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Row card</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kb/tokens.css">
<link rel="stylesheet" href="reader.css">
<link rel="stylesheet" href="figures.css">
<script src="reader.js"></script>
</head>
<body>
<x-dc>
<div class="{{ wrapCls }}" data-theme="{{ wrapTheme }}"><div class="{{ flowCls }}" lang="{{ lang }}">
<div class="{{ c.toneCls }}"><p class="fg-card__title"><sc-for list="{{ c.titleParts }}" as="pt" hint-placeholder-count="1"><sc-if value="{{ pt.isKo }}" hint-placeholder-val="{{ false }}"><span lang="ko">{{ pt.v }}</span></sc-if><sc-if value="{{ pt.isPlain }}" hint-placeholder-val="{{ true }}">{{ pt.v }}</sc-if></sc-for></p><sc-for list="{{ c.body }}" as="bp" hint-placeholder-count="1"><p class="fg-card__p"><sc-for list="{{ bp.runs }}" as="r" hint-placeholder-count="3"><sc-if value="{{ r.isText }}" hint-placeholder-val="{{ true }}">{{ r.v }}</sc-if><sc-if value="{{ r.isKo }}" hint-placeholder-val="{{ false }}"><span lang="ko">{{ r.v }}</span></sc-if><sc-if value="{{ r.isEm }}" hint-placeholder-val="{{ false }}"><em><sc-for list="{{ r.parts }}" as="pt" hint-placeholder-count="1"><sc-if value="{{ pt.isKo }}" hint-placeholder-val="{{ false }}"><span lang="ko">{{ pt.v }}</span></sc-if><sc-if value="{{ pt.isPlain }}" hint-placeholder-val="{{ true }}">{{ pt.v }}</sc-if></sc-for></em></sc-if><sc-if value="{{ r.isStrong }}" hint-placeholder-val="{{ false }}"><strong><sc-for list="{{ r.parts }}" as="pt" hint-placeholder-count="1"><sc-if value="{{ pt.isKo }}" hint-placeholder-val="{{ false }}"><span lang="ko">{{ pt.v }}</span></sc-if><sc-if value="{{ pt.isPlain }}" hint-placeholder-val="{{ true }}">{{ pt.v }}</sc-if></sc-for></strong></sc-if><sc-if value="{{ r.isDel }}" hint-placeholder-val="{{ false }}"><del><sc-for list="{{ r.parts }}" as="pt" hint-placeholder-count="1"><sc-if value="{{ pt.isKo }}" hint-placeholder-val="{{ false }}"><span lang="ko">{{ pt.v }}</span></sc-if><sc-if value="{{ pt.isPlain }}" hint-placeholder-val="{{ true }}">{{ pt.v }}</sc-if></sc-for></del></sc-if><sc-if value="{{ r.isCode }}" hint-placeholder-val="{{ false }}"><code class="rd-ic">{{ r.v }}</code></sc-if><sc-if value="{{ r.isLink }}" hint-placeholder-val="{{ false }}"><a class="rd-a" href="{{ r.href }}" data-to="{{ r.to }}" onclick="{{ linkClick }}"><sc-for list="{{ r.parts }}" as="pt" hint-placeholder-count="1"><sc-if value="{{ pt.isKo }}" hint-placeholder-val="{{ false }}"><span lang="ko">{{ pt.v }}</span></sc-if><sc-if value="{{ pt.isPlain }}" hint-placeholder-val="{{ true }}">{{ pt.v }}</sc-if></sc-for></a></sc-if><sc-if value="{{ r.isExt }}" hint-placeholder-val="{{ false }}"><a class="rd-a" href="#top" data-to="{{ r.to }}" onclick="{{ linkClick }}"><sc-for list="{{ r.parts }}" as="pt" hint-placeholder-count="1"><sc-if value="{{ pt.isKo }}" hint-placeholder-val="{{ false }}"><span lang="ko">{{ pt.v }}</span></sc-if><sc-if value="{{ pt.isPlain }}" hint-placeholder-val="{{ true }}">{{ pt.v }}</sc-if></sc-for><span class="rd-a__ext"> · new tab</span></a></sc-if><sc-if value="{{ r.isMissing }}" hint-placeholder-val="{{ false }}"><span class="rd-missing"><sc-for list="{{ r.parts }}" as="pt" hint-placeholder-count="1"><sc-if value="{{ pt.isKo }}" hint-placeholder-val="{{ false }}"><span lang="ko">{{ pt.v }}</span></sc-if><sc-if value="{{ pt.isPlain }}" hint-placeholder-val="{{ true }}">{{ pt.v }}</sc-if></sc-for></span></sc-if><sc-if value="{{ r.isCite }}" hint-placeholder-val="{{ false }}"><a class="{{ r.cls }}" id="{{ r.citeId }}" href="{{ r.href }}" data-to="{{ r.to }}" onclick="{{ citeClick }}"><sc-for list="{{ r.parts }}" as="pt" hint-placeholder-count="1"><sc-if value="{{ pt.isKo }}" hint-placeholder-val="{{ false }}"><span lang="ko">{{ pt.v }}</span></sc-if><sc-if value="{{ pt.isPlain }}" hint-placeholder-val="{{ true }}">{{ pt.v }}</sc-if></sc-for><span class="fg-cite__n">{{ r.num }}</span></a></sc-if></sc-for></p></sc-for></div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"card":{"editor":null},"lang":{"editor":null},"onLink":{"editor":null},"bare":{"editor":null},"theme":{"editor":null},"size":{"editor":null},"$preview":{"width":320,"height":260}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tick: 0 }; }

  linkClick = (e) => {
    const to = e.currentTarget.getAttribute('data-to');
    if (!this.props.onLink) { if (e.currentTarget.getAttribute('href') === '#top') e.preventDefault(); return; }
    e.preventDefault();
    this.props.onLink(to);
  };
  /* A citation: the source item becomes the target (the product's :target), then the reader's own anchor jump. */
  citeClick = (e) => {
    const to = e.currentTarget.getAttribute('data-to');
    e.preventDefault();
    if (!this.props.bare) return;
    if (window.RD.figs) window.RD.figs.go({ target: to.slice(1), here: '' });
    if (this.props.onLink) this.props.onLink(to);
  };
  /* Canvas only: a part shown alone on a Components board has no chapter around it, so its in-chapter links
     (#id, a citation) point at #top there and do nothing; data-to keeps the real target. In the reader they go. */
  loc(o) {
    if (this.props.bare) return o;
    const walk = (x) => {
      if (Array.isArray(x)) return x.map(walk);
      if (!x || typeof x !== 'object') return x;
      const n = {};
      for (const k in x) n[k] = (k === 'svg' || k === 'a') ? x[k] : walk(x[k]);
      if ((n.isLink || n.isCite) && typeof n.href === 'string' && n.href.charAt(0) === '#' && n.href !== '#top') n.href = '#top';
      return n;
    };
    return walk(o);
  }
  componentDidMount() {
    const F = window.RD.figs;
    if (F) this.unsub = F.sub(() => this.setState({ tick: (this.state.tick || 0) + 1 }));
    if (this.check && document.fonts && document.fonts.ready) document.fonts.ready.then(() => this.check());
  }
  componentWillUnmount() {
    if (this.unsub) this.unsub();
    if (this.ro) this.ro.disconnect();
    if (this.box) this.box.removeEventListener('scroll', this.onScroll);
  }
  wrap(rm) {
    const P = this.props, bare = !!P.bare;
    return {
      wrapCls: (bare ? 'rd-pass' : 'rd-frame rd-size-' + (P.size || 3) + ' rd-standalone') + (rm ? ' fg-rm' : ''),
      wrapTheme: bare ? undefined : (P.theme || 'light'),
      flowCls: bare ? 'fg-pass' : 'rd-flow fg-solo',
      lang: bare ? (P.lang || undefined) : (P.lang || 'en'),
      linkClick: this.linkClick,
      citeClick: this.citeClick,
    };
  }

  renderVals() {
    const RD = window.RD, P = this.props;
    const c = this.loc(P.card || RD.read('maintainer-guide/read-surfaces', 'en').blocks.find((x) => x.id === 'house-style-rules').items[0]);
    return Object.assign(this.wrap(false), { c });
  }
}
</script>
</body>
</html>
