<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reader — the chapter screen</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kb/tokens.css">
<link rel="stylesheet" href="reader.css">
<script src="reader.js"></script>
</head>
<body>
<x-dc>
<div class="{{ frameCls }}" data-theme="{{ theme }}" style="{{ frameStyle }}" ref="{{ setFrame }}" onkeydown="{{ onKey }}"><div class="rd-in">
<div class="{{ scrollCls }}" ref="{{ setBox }}" onscroll="{{ onScroll }}" aria-busy="{{ busy }}">
<sc-if value="{{ hasBar }}" hint-placeholder-val="{{ false }}"><div data-proto="state-bar"><div class="pb-cell"><sc-for list="{{ bar }}" as="g" hint-placeholder-count="2"><div class="{{ g.cls }}" role="group" aria-label="{{ g.name }}"><span class="pb-cap">Prototype only · jump to a state:</span><span class="pb-name">{{ g.name }}</span><sc-for list="{{ g.presets }}" as="p" hint-placeholder-count="4"><button type="button" aria-pressed="{{ p.pressed }}" data-label="{{ p.label }}" onclick="{{ p.pick }}">{{ p.label }}</button></sc-for><sc-if value="{{ g.hasExtra }}" hint-placeholder-val="{{ false }}"><span class="pb-sep">{{ g.extraLabel }}</span><sc-for list="{{ g.extra }}" as="t" hint-placeholder-count="4"><button type="button" aria-pressed="{{ t.pressed }}" data-label="{{ t.label }}" onclick="{{ t.pick }}">{{ t.label }}</button></sc-for></sc-if><sc-if value="{{ g.only }}" hint-placeholder-val="{{ false }}"><span class="pb-note">only state</span></sc-if></div></sc-for></div></div></sc-if>
<div class="rd-topwrap" ref="{{ setTop }}"><dc-import name="ReaderTop" bare="{{ true }}" pct="{{ pct }}" back-long="{{ backLong }}" back-short="{{ backShort }}" is-old="{{ isOld }}" version="{{ version }}" langs="{{ langs }}" lang="{{ lang }}" member="{{ member }}" panel="{{ panel }}" on-back="{{ goBack }}" on-logo="{{ goLibrary }}" on-lang="{{ onLang }}" on-display="{{ toggleDisplay }}" on-sign-in="{{ signIn }}" hint-size="100%,59px"></dc-import><sc-if value="{{ hiddenNow }}" hint-placeholder-val="{{ false }}"><button type="button" class="rd-btn rd-btn--secondary rd-skip" onclick="{{ showChrome }}">Show reading controls</button></sc-if></div>
<sc-if value="{{ isReady }}" hint-placeholder-val="{{ true }}"><div class="rd-article" onclick="{{ onTap }}">
<dc-import name="ChapterHead" bare="{{ true }}" doc="{{ doc }}" lang="{{ lang }}" ver="{{ ver }}" on-link="{{ onLink }}" on-versions="{{ openVersions }}" on-latest="{{ readLatest }}" on-source="{{ readSource }}" hint-size="100%,520px"></dc-import>
<dc-import name="Prose" bare="{{ true }}" blocks="{{ blocks }}" lang="{{ lang }}" on-link="{{ onLink }}" hint-size="100%,2400px"></dc-import>
<dc-import name="ChapterEnd" bare="{{ true }}" doc="{{ doc }}" lang="{{ lang }}" prog="{{ prog }}" member="{{ member }}" prompt="{{ prompt }}" on-mark="{{ onMark }}" on-open="{{ onOpen }}" on-book="{{ goBook }}" on-library="{{ goLibrary }}" on-prompt="{{ onPrompt }}" on-sign-in="{{ signIn }}" hint-size="100%,640px"></dc-import>
</div></sc-if>
<sc-if value="{{ isState }}" hint-placeholder-val="{{ false }}"><dc-import name="ReaderState" bare="{{ true }}" kind="{{ status }}" noun="{{ noun }}" on-retry="{{ onRetry }}" on-library="{{ goLibrary }}" hint-size="100%,520px"></dc-import></sc-if>
</div>
<sc-if value="{{ showResume }}" hint-placeholder-val="{{ false }}"><div class="rd-resume"><span class="rd-resume__text">Picked up where you left off · <b lang="{{ lang }}">{{ resumeAt }}</b></span><button type="button" class="rd-btn rd-btn--quiet" onclick="{{ fromTop }}">From the top</button></div></sc-if>
<sc-if value="{{ hasBottom }}" hint-placeholder-val="{{ true }}"><dc-import name="ReaderBottom" bare="{{ true }}" n="{{ n }}" total="{{ total }}" pct="{{ pct }}" prev-title="{{ prevTitle }}" prev-lang="{{ prevLang }}" next-title="{{ nextTitle }}" next-lang="{{ nextLang }}" book-title="{{ bookTitle }}" panel="{{ panel }}" on-prev="{{ goPrev }}" on-next="{{ goNext }}" on-book="{{ goBook }}" on-contents="{{ toggleContents }}" hint-size="100%,60px"></dc-import></sc-if>
<sc-if value="{{ sheetOpen }}" hint-placeholder-val="{{ false }}"><button type="button" class="rd-scrim" tabindex="-1" aria-label="Close panel" onclick="{{ closePanel }}"></button></sc-if>
<sc-if value="{{ isContents }}" hint-placeholder-val="{{ false }}"><div class="rd-sheet rd-sheet--left" role="dialog" aria-modal="true" aria-label="Contents"><div class="rd-sheet__head"><h2 class="rd-sheet__title">Contents</h2><button type="button" class="rd-btn rd-btn--quiet rd-sheet__close" onclick="{{ closePanel }}">Close</button></div><div class="rd-sheet__body"><p class="rd-sheet__booktitle">{{ bookTitle }}</p><p class="rd-sheet__bookmeta">{{ bookMeta }}</p><dc-import name="ChapterList" bare="{{ true }}" book="{{ book }}" cur="{{ doc }}" prog="{{ prog }}" member="{{ member }}" lang="{{ lang }}" sections="{{ secList }}" sec="{{ curH2 }}" on-open="{{ onOpen }}" on-section="{{ onSection }}" hint-size="100%,420px"></dc-import></div></div></sc-if>
<sc-if value="{{ isDisplay }}" hint-placeholder-val="{{ false }}"><div class="rd-sheet rd-sheet--right" role="dialog" aria-modal="true" aria-label="Display"><div class="rd-sheet__head"><h2 class="rd-sheet__title">Display</h2><button type="button" class="rd-btn rd-btn--quiet rd-sheet__close" onclick="{{ closePanel }}">Close</button></div><div class="rd-sheet__body"><dc-import name="DisplayPanel" bare="{{ true }}" size="{{ size }}" theme-choice="{{ themeChoice }}" os="{{ os }}" on-size="{{ onSize }}" on-theme="{{ onTheme }}" hint-size="100%,360px"></dc-import></div></div></sc-if>
<sc-if value="{{ isVersions }}" hint-placeholder-val="{{ false }}"><div class="rd-sheet rd-sheet--right" role="dialog" aria-modal="true" aria-label="Version history"><div class="rd-sheet__head"><h2 class="rd-sheet__title">Version history</h2><button type="button" class="rd-btn rd-btn--quiet rd-sheet__close" onclick="{{ closePanel }}">Close</button></div><div class="rd-sheet__body"><dc-import name="VersionList" bare="{{ true }}" doc="{{ doc }}" lang="{{ lang }}" ver="{{ ver }}" fail="{{ verFail }}" on-open="{{ onVersion }}" hint-size="100%,240px"></dc-import></div></div></sc-if>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"doc":{"editor":null},"lang":{"editor":null},"ver":{"editor":null},"theme":{"editor":null},"themeChoice":{"editor":null},"os":{"editor":null},"size":{"editor":null},"member":{"editor":null},"chrome":{"editor":null},"panel":{"editor":null},"status":{"editor":null},"prog":{"editor":null},"jump":{"editor":null},"prompt":{"editor":null},"resumed":{"editor":null},"verFail":{"editor":null},"hold":{"editor":null},"fit":{"editor":null},"bar":{"editor":null},"onOpen":{"editor":null},"onLang":{"editor":null},"onVersion":{"editor":null},"onTheme":{"editor":null},"onSize":{"editor":null},"onPanel":{"editor":null},"onChrome":{"editor":null},"onMark":{"editor":null},"onEnd":{"editor":null},"onEndLeft":{"editor":null},"onReading":{"editor":null},"onAway":{"editor":null},"onRetry":{"editor":null},"onPrompt":{"editor":null},"onFromTop":{"editor":null},"onDismissResume":{"editor":null},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { pct: 0, sec: null, barVis: 0 };
    this.box = null;
    this.top = null;
    this.frame = null;
    this.lastTop = 0;
    this.quietUntil = 0;
    this.sent = { pct: -10, sec: undefined };
    this.endIn = false;
    this.userScrolled = false;
  }
  setBox = (el) => { this.box = el; };
  setTop = (el) => { this.top = el; };
  setFrame = (el) => { this.frame = el; };
  /* The canvas's state bar sits above the reader in the scroller; barOff is its height (0 in the product). */
  barOff() {
    const bar = this.box && this.box.querySelector('[data-proto="state-bar"]');
    return bar ? bar.offsetHeight : 0;
  }
  /* A jump lands its heading this far below the frame's top: the progress line and the top bar, plus 16 px. */
  offset() {
    return (this.top ? this.top.offsetHeight : 59) + 16;
  }
  componentDidMount() {
    this.applyJump();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!this.userScrolled) this.applyJump(); });
  }
  componentDidUpdate(prev) {
    const P = this.props;
    const jt = (P.jump && P.jump.token) || 0, pjt = (prev.jump && prev.jump.token) || 0;
    if (jt !== pjt || P.doc !== prev.doc || P.lang !== prev.lang || P.ver !== prev.ver || (P.status === 'ready' && prev.status !== 'ready')) {
      this.userScrolled = false;
      if (P.doc !== prev.doc || P.lang !== prev.lang || P.ver !== prev.ver) { this.endIn = false; this.sent = { pct: -10, sec: undefined }; }
      this.applyJump();
    }
    if (P.panel && P.panel !== prev.panel) this.focusSheet();
    if (!P.panel && prev.panel) this.restoreFocus();
  }
  applyJump() {
    const j = this.props.jump || {};
    const t0 = Date.now();
    const run = () => {
      const box = this.box;
      if (!box) { if (Date.now() - t0 < 4000) requestAnimationFrame(run); return; }
      let top = 0;
      if (j.id) {
        const el = j.id === 'chapter-end' ? box.querySelector('[data-end]') : box.querySelector('[id="' + j.id + '"]');
        if (!el) { if (Date.now() - t0 < 4000) requestAnimationFrame(run); return; }
        top = el.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop - this.offset();
      } else if (j.frac) {
        const off = this.barOff();
        top = off + j.frac * (box.scrollHeight - box.clientHeight - off);
      }
      this.quietUntil = Date.now() + 450;
      box.scrollTop = Math.max(0, Math.round(top));
      this.lastTop = box.scrollTop;
      this.measure();
    };
    requestAnimationFrame(run);
  }
  jumpLocal(id) {
    const box = this.box;
    if (!box) return;
    const el = box.querySelector('[id="' + id + '"]');
    if (!el) return;
    this.quietUntil = Date.now() + 450;
    box.scrollTop = Math.max(0, Math.round(el.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop - this.offset()));
    this.lastTop = box.scrollTop;
    this.measure();
  }
  measure() {
    const box = this.box, P = this.props;
    if (!box) return;
    /* how much of the state bar is in view: the sheets and their scrim start under it (canvas only) */
    const barVis = Math.max(0, Math.round(this.barOff() - box.scrollTop));
    if ((P.status || 'ready') !== 'ready') { if (barVis !== this.state.barVis) this.setState({ barVis }); return; }
    const off = this.barOff();
    const max = Math.max(1, box.scrollHeight - box.clientHeight - off);
    const pct = Math.round(Math.min(1, Math.max(0, box.scrollTop - off) / max) * 100);
    const line = (this.top ? this.top.getBoundingClientRect().bottom : box.getBoundingClientRect().top + 59) + 16 + 8;
    let sec = null;
    box.querySelectorAll('.rd-h2[id], .rd-h3[id]').forEach((h) => { if (h.getBoundingClientRect().top <= line) sec = h.id; });
    if (pct !== this.state.pct || sec !== this.state.sec || barVis !== this.state.barVis) this.setState({ pct, sec, barVis });
    if (P.onReading && (sec !== this.sent.sec || Math.abs(pct - this.sent.pct) >= 5)) {
      this.sent = { pct, sec };
      P.onReading({ pct, sec });
    }
    /* The end of the chapter: each time it comes into view (40 px above the bottom, or 95% read) the flow is told, and
       each time it leaves. Whether that finishes the chapter is the flow's rule (after Mark as unread, not until the
       reader has left the end). */
    const end = box.querySelector('[data-end]');
    if (end) {
      const seen = end.getBoundingClientRect().top < box.getBoundingClientRect().bottom - 40 || pct >= 95;
      if (seen && !this.endIn) { this.endIn = true; if (P.onEnd) P.onEnd(); }
      else if (!seen && this.endIn) { this.endIn = false; if (P.onEndLeft) P.onEndLeft(); }
    }
  }
  onScroll = () => {
    const box = this.box, P = this.props;
    if (!box) return;
    const top = box.scrollTop, dy = top - this.lastTop;
    this.lastTop = top;
    const quiet = Date.now() < this.quietUntil;
    if (!quiet) this.userScrolled = true;
    if (!quiet && P.onChrome && !P.panel) {
      const max = box.scrollHeight - box.clientHeight;
      let want = null;
      /* the top of the chapter is under the state bar: count from there */
      if (top - this.barOff() < 48 || top >= max - 4) want = 'shown';
      else if (dy > 4) want = 'hidden';
      else if (dy < -12) want = 'shown';
      if (want && want !== (P.chrome || 'shown')) {
        P.onChrome(want);
        if (want === 'hidden' && P.resumed && P.onDismissResume) P.onDismissResume();
      }
    }
    this.measure();
  };
  onTap = (e) => {
    const P = this.props;
    if (!P.onChrome) return;
    if (e.target.closest('a, button, summary, details, pre, table, [tabindex], input, label')) return;
    if (window.getSelection && String(window.getSelection())) return;
    P.onChrome((P.chrome || 'shown') === 'hidden' ? 'shown' : 'hidden');
  };
  onKey = (e) => {
    if (e.key === 'Escape' && this.props.panel && this.props.onPanel) {
      e.stopPropagation();
      this.props.onPanel(null);
    }
  };
  focusSheet() {
    if (!this.opener) this.opener = document.activeElement;
    const t0 = Date.now();
    const go = () => {
      const b = this.frame && this.frame.querySelector('.rd-sheet__close');
      if (b) b.focus({ preventScroll: true });
      else if (Date.now() - t0 < 1500) requestAnimationFrame(go);
    };
    requestAnimationFrame(go);
    if (this.props.panel === 'contents') {
      /* a long book: open the list with the current chapter in view, a third of the way down */
      const show = () => {
        const body = this.frame && this.frame.querySelector('.rd-sheet--left .rd-sheet__body');
        const row = body && body.querySelector('.rd-ch[aria-current="page"]');
        if (!row) { if (Date.now() - t0 < 4000) requestAnimationFrame(show); return; }
        const top = row.getBoundingClientRect().top - body.getBoundingClientRect().top + body.scrollTop;
        if (top + row.offsetHeight > body.scrollTop + body.clientHeight) body.scrollTop = Math.max(0, top - body.clientHeight / 3);
      };
      requestAnimationFrame(show);
    }
  }
  restoreFocus() {
    const o = this.opener;
    this.opener = null;
    if (o && o.isConnected && this.frame && this.frame.contains(o)) o.focus({ preventScroll: true });
  }
  renderVals() {
    const RD = window.RD, P = this.props;
    const doc = P.doc || 'maintainer-guide/internals';
    const member = P.member === undefined ? true : !!P.member;
    const prog = P.prog || RD.progress;
    let status = P.status || 'ready';
    const r = RD.read(doc, P.lang || 'en', P.ver);
    if (status === 'ready' && !r) status = 'notfound';
    const ctx = RD.ctx(doc) || { loose: true, total: 0, n: 0 };
    const loose = !!ctx.loose;
    const lang = r ? r.lang : 'en';
    const panel = P.panel || null;
    const chrome = P.chrome || 'shown';
    const size = P.size || 3;
    const theme = P.theme || 'light';
    const ready = status === 'ready';
    const pct = ready ? this.state.pct : 0;
    const LANG = { en: 'English', ko: '한국어' };
    const call = (fn) => (e) => { if (e && e.preventDefault) e.preventDefault(); fn(); };
    const away = (kind, detail) => () => { if (P.onAway) P.onAway(kind, detail); };
    const sections = r ? r.sections : [];
    let curH2 = null;
    if (r && this.state.sec) {
      let h2 = null;
      r.blocks.forEach((b) => { if (b.isH2) h2 = b.id; if (b.id === this.state.sec) curH2 = h2; });
    }
    const jumpId = P.jump && P.jump.id;
    let resumeAt = '';
    sections.forEach((s) => { if (s.id === jumpId) resumeAt = s.text; });
    const prevKey = !loose && ctx.prev, nextKey = !loose && ctx.next;
    const tPrev = prevKey ? RD.titleOf(prevKey, lang) : { text: '', lang: 'en' };
    const tNext = nextKey ? RD.titleOf(nextKey, lang) : { text: '', lang: 'en' };
    const src = r && r.from;
    const done = loose ? 0 : RD.finishedCount(ctx.bookKey, prog);
    const togglePanel = (name) => () => { if (P.onPanel) P.onPanel(panel === name ? null : name); };
    const bar = Array.isArray(P.bar) ? P.bar.map((g) => Object.assign({ hasExtra: false, extraLabel: '', extra: [] }, g)) : [];
    return {
      bar,
      hasBar: bar.length > 0,
      frameStyle: '--rd-barvis: ' + (bar.length ? this.state.barVis : 0) + 'px',
      setTop: this.setTop,
      frameCls: 'rd-frame rd-size-' + size + ' rd-theme-' + theme + (chrome === 'hidden' && ready ? ' rd-chrome-hidden' : '') + (P.fit === 'fill' ? ' rd-frame--fill' : ' rd-frame--alone') + (member ? '' : ' rd-anon') + (loose ? ' rd-loose' : ''),
      theme, size, themeChoice: P.themeChoice || 'system', os: P.os || 'light',
      doc, lang, ver: P.ver || null, member, prog, panel, status, noun: loose ? 'document' : 'chapter',
      pct,
      backLong: loose ? 'Library' : ctx.bookTitle,
      backShort: loose ? 'Library' : 'Book',
      isOld: !!(r && r.isOld && ready),
      version: r ? r.version : 1,
      langs: r && ready ? r.langs : [],
      blocks: r ? r.blocks : [],
      isReady: ready && !!r,
      isState: !ready,
      busy: status === 'loading' ? 'true' : undefined,
      scrollCls: 'rd-scroll' + (ready && !loose ? '' : ' rd-scroll--nobottom'),
      hasBottom: ready && !loose,
      hiddenNow: chrome === 'hidden' && ready,
      showResume: !!P.resumed && ready && !panel && !!resumeAt && chrome !== 'hidden',
      resumeAt,
      n: ctx.n || 0, total: ctx.total || 0,
      prevTitle: tPrev.text, prevLang: tPrev.lang, nextTitle: tNext.text, nextLang: tNext.lang,
      bookTitle: loose ? '' : ctx.bookTitle,
      book: loose ? '' : ctx.bookKey,
      bookMeta: loose ? '' : 'Chapter ' + ctx.n + ' of ' + ctx.total + (member ? ' · ' + done + ' of ' + ctx.total + ' finished' : ''),
      secList: r ? r.toc.map((e) => ({ id: e.id, text: e.text })) : [],
      curH2,
      prompt: !!P.prompt,
      verFail: !!P.verFail,
      sheetOpen: !!panel,
      isContents: panel === 'contents' && !loose,
      isDisplay: panel === 'display',
      isVersions: panel === 'versions' && !!r,
      onLink: (to) => {
        const t = RD.resolve(to);
        if (t.kind === 'anchor') this.jumpLocal(t.id);
        else if ((t.kind === 'chapter' || t.kind === 'doc') && P.onOpen) P.onOpen(t.doc, t.id);
        else if (t.kind === 'ext' && P.onAway) P.onAway('external', t.url);
      },
      onSection: (id) => { if (P.onPanel) P.onPanel(null); setTimeout(() => this.jumpLocal(id), 30); },
      onOpen: P.onOpen,
      onLang: P.onLang,
      onVersion: P.onVersion,
      onSize: P.onSize,
      onTheme: P.onTheme,
      onMark: P.onMark,
      onPrompt: P.onPrompt,
      onRetry: P.onRetry,
      goBack: away(loose ? 'library' : 'book', loose ? '' : ctx.bookTitle),
      goBook: away('book', loose ? '' : ctx.bookTitle),
      goLibrary: away('library'),
      signIn: away('signin'),
      goPrev: () => { if (P.onOpen && prevKey) P.onOpen(prevKey); },
      goNext: () => { if (P.onOpen && nextKey) P.onOpen(nextKey); },
      toggleDisplay: togglePanel('display'),
      toggleContents: togglePanel('contents'),
      openVersions: () => { if (P.onPanel) P.onPanel('versions'); },
      closePanel: call(() => { if (P.onPanel) P.onPanel(null); }),
      readLatest: () => { if (P.onVersion && r) P.onVersion(r.newest); },
      readSource: () => { if (P.onLang && src) P.onLang(src.lang); },
      showChrome: () => { if (P.onChrome) P.onChrome('shown'); },
      fromTop: () => { if (P.onFromTop) P.onFromTop(); },
      onKey: this.onKey,
      onScroll: this.onScroll,
      onTap: this.onTap,
      setBox: this.setBox,
      setFrame: this.setFrame,
    };
  }
}
</script>
</body>
