        key: m.key, style: t === undefined ? 'top: 0px; visibility: hidden' : 'top: ' + t + 'px',
        item: { kind: m.kind, label: m.label || '', text: m.text || '', lang: m.lang || 'en', hasL: !!m.hasL, ll: m.ll || 'en', lname: m.lname || '' },
        current: cur, open: () => act.marker(actStr)
      };
    });
    /* the place bar: the section the reader is in (or, in a plain document, the position) */
    const blkS = v && v.native && this.state.blk ? v.lay.secs[this.state.blk] : null;
    const showPlace = !!(v && !panel && !showResume && !A.sel && !A.pop && !A.toast && !A.save && !this.state.endSeen && (v.native ? !!blkS : true));
    const pl = v && v.native ? { kind: 'block', title: blkS ? AN.secLabel(blkS) : '', titleLang: lang, on: !!(blkS && v.bmBySec[blkS.id]) }
      : { kind: 'pos', title: '', titleLang: 'en', on: posOnAt(pct / 100) };
    const count = v && member ? v.count : 0;
    /* the Notes sheet */
    const np = v ? { items: v.items, other: v.other, orphans: v.orphans, otherLang: v.other.length ? v.other[0].lang : (lang === 'en' ? 'ko' : 'en'), loose, editLabel: A.editLabel || null }
      : { items: [], other: [], orphans: [], otherLang: 'ko', loose, editLabel: null };
    const goVer = popVm && popVm.goVer, goLang = popVm && popVm.goLangCode;
    return {
      bar,
      hasBar: bar.length > 0,
      frameStyle: '--rd-barvis: ' + (bar.length ? this.state.barVis : 0) + 'px',
      setTop: this.setTop,
      frameCls: 'rd-frame rd-size-' + size + ' rd-theme-' + theme + (chrome === 'hidden' && ready ? ' rd-chrome-hidden' : '') + (P.fit === 'fill' ? ' rd-frame--fill' : ' rd-frame--alone') + (member ? '' : ' rd-anon') + (loose ? ' rd-loose' : ''),
      theme, size, themeChoice: P.themeChoice || 'system', os: P.os || 'light',
      doc, lang, ver: P.ver || null, member, prog, panel, status, noun: loose ? 'document' : 'chapter',
      pct,
      backLong: loose ? 'Library' : ctx.bookTitle,
      backShort: loose ? 'Library' : 'Book',
      isOld: !!(r && r.isOld && ready),
      version: r ? r.version : 1,
      langs: r && ready ? r.langs : [],
      blocks: v ? v.blocks : r ? r.blocks : [],
      isReady: ready && !!r,
      isState: !ready,
      busy: status === 'loading' ? 'true' : undefined,
      scrollCls: 'rd-scroll' + (ready && !loose ? '' : ' rd-scroll--nobottom'),
      hasBottom: ready && !loose,
      hiddenNow: chrome === 'hidden' && ready,
      showResume,
      resumeAt,
      n: ctx.n || 0, total: ctx.total || 0,
      prevTitle: tPrev.text, prevLang: tPrev.lang, nextTitle: tNext.text, nextLang: tNext.lang,
      bookTitle: loose ? '' : ctx.bookTitle,
      book: loose ? '' : ctx.bookKey,
      bookMeta: loose ? '' : 'Chapter ' + ctx.n + ' of ' + ctx.total + (member ? ' · ' + done + ' of ' + ctx.total + ' finished' : ''),
      secList: r ? r.toc.map((e) => ({ id: e.id, text: e.text })) : [],
      curH2,
      prompt: !!P.prompt,
      verFail: !!P.verFail,
      sheetOpen: !!panel,
      isContents: panel === 'contents' && !loose,
      isDisplay: panel === 'display',
      isVersions: panel === 'versions' && !!r,
      onLink: (to) => {
        const t = RD.resolve(to);
        if (t.kind === 'anchor') this.jumpLocal(t.id);
        else if ((t.kind === 'chapter' || t.kind === 'doc') && P.onOpen) P.onOpen(t.doc, t.id);
        else if (t.kind === 'ext' && P.onAway) P.onAway('external', t.url);
      },
      onSection: (id) => { if (P.onPanel) P.onPanel(null); setTimeout(() => this.jumpLocal(id), 30); },
      onOpen: P.onOpen,
      onLang: P.onLang,
      onVersion: P.onVersion,
      onSize: P.onSize,
      onTheme: P.onTheme,
      onMark: P.onMark,
      onPrompt: P.onPrompt,
      onRetry: P.onRetry,
      goBack: away(loose ? 'library' : 'book', loose ? '' : ctx.bookTitle),
      goBook: away('book', loose ? '' : ctx.bookTitle),
      goLibrary: away('library'),
      signIn: away('signin'),
      goPrev: () => { if (P.onOpen && prevKey) P.onOpen(prevKey); },
      goNext: () => { if (P.onOpen && nextKey) P.onOpen(nextKey); },
      toggleDisplay: togglePanel('display'),
      toggleContents: () => { if (P.onPanel) P.onPanel(panel === 'contents' || panel === 'notes' ? null : 'contents'); },
      openVersions: () => { if (P.onPanel) P.onPanel('versions'); },
      closePanel: call(() => { if (P.onPanel) P.onPanel(null); }),
      readLatest: () => { if (P.onVersion && r) P.onVersion(r.newest); },
      readSource: () => { if (P.onLang && src) P.onLang(src.lang); },
      showChrome: () => { if (P.onChrome) P.onChrome('shown'); },
      fromTop: () => { if (P.onFromTop) P.onFromTop(); },
      onKey: this.onKey,
      onScroll: this.onScroll,
      onTap: this.onTap,
      setBox: this.setBox,
      setFrame: this.setFrame,
      /* the annotation layer */
      setArt: this.setArt, setFloat: this.setFloat, onSelEnd: this.onSelEnd,
      onMarker: (k) => act.marker(k),
      topNotes: loose && ready && !!r,
      toggleNotes: togglePanel('notes'),
      hasRail: rail.length > 0, rail,
      hasFloat: !!want && (want.kind !== 'pop' || !!popVm), floatCls: want ? 'an-float an-float--' + (want.kind === 'bar' ? 'sel' : want.kind) : 'an-float', floatStyle,
      isSelBar: !!(want && want.kind === 'bar'), sb,
      sbHighlight: () => { this.clearNative(); act.highlight(sel && sel.id); },
      sbNote: () => { this.clearNative(); act.noteSel(sel && sel.id); },
      sbBlockNote: () => { this.clearNative(); act.blockNote(sel && sel.sec, 'sel'); },
      sbBookmark: () => act.bookmark(sel && sel.sec, 'sel'),
      sbBookmarkPos: () => act.bookmarkPos(this.posNow(), 'sel'),
      isPop: !!popVm, popVm: popVm || { mode: 'view' },
      popClose: () => act.closePop(), popEdit: () => act.editNote(), popSave: (t) => act.saveNote(t), popCancel: () => act.cancelEdit(),
      popDeleteNote: () => act.deleteNote(), popReview: () => act.review(), popDelete: () => act.del(pop && pop.id),
      popDeleteItem: (id) => act.del(id), popPick: (id) => act.marks([id]),
      popGo: () => { if (goVer) act.readVer(goVer, pop && pop.sec); else if (goLang) act.readIn(goLang, pop && pop.sec); },
      popEditLabel: () => act.label(pop && pop.id), popSaveLabel: (t) => act.saveLabel(pop && pop.id, t), popCancelLabel: () => act.cancelLabel(),
      isSaveSel: !!(want && want.kind === 'save'), saveWhat: A.save ? A.save.what : 'highlights and notes', dismissSave: () => act.dismissSave(),
      showPlace, pl,
      plNote: () => { if (blkS) act.blockNote(blkS.id, 'place'); },
      plBookmark: () => { if (v && v.native) { if (blkS) act.bookmark(blkS.id, 'place'); } else act.bookmarkPos(this.posNow(), 'place'); },
      showToast: !!(A.toast && ready), toastText: A.toast ? A.toast.text : '', undo: () => act.undo(),
      showSaveBm: !!(A.save && A.save.at === 'slot' && ready),
      hasNotesN: count > 0, notesN: count,
      toNotes: () => { if (P.onPanel) P.onPanel('notes'); },
      toContents: () => { if (P.onPanel) P.onPanel('contents'); },
      isNotes: panel === 'notes' && ready && !!r, hasContents: !loose,
      np,
      npGo: (it) => act.go(it), npDelete: (it) => act.del(it.id), npLabel: (it) => act.label(it.id),
      npSaveLabel: (it, t) => act.saveLabel(it.id, t), npCancelLabel: () => act.cancelLabel(), npBook: () => act.openBook(),
    };
  }
}
