<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Book page — the flow</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kb/tokens.css">
<link rel="stylesheet" href="reader.css">
<link rel="stylesheet" href="book.css">
<script src="book.js"></script>
</head>
<body>
<x-dc>
<div class="bk-proto" data-theme="{{ theme }}">
<sc-if value="{{ onBook }}" hint-placeholder-val="{{ true }}"><dc-import name="BookPage" fit="page" bar="{{ groups }}" book="{{ p.book }}" viewer="{{ p.viewer }}" pk="{{ p.pk }}" status="{{ p.status }}" vers="{{ p.vers }}" clear="{{ p.clear }}" theme="{{ p.theme }}" tok="{{ p.tok }}" reveal="{{ p.reveal }}" jump="{{ p.jump }}" on-open="{{ p.onOpen }}" on-versions="{{ p.onVersions }}" on-notes="{{ p.onNotes }}" on-library="{{ p.onLibrary }}" on-sign-in="{{ p.onSignIn }}" on-ask="{{ p.onAsk }}" on-cancel="{{ p.onCancel }}" on-confirm="{{ p.onConfirm }}" on-retry="{{ p.onRetry }}" hint-size="100%,1800px"></dc-import></sc-if>
<sc-if value="{{ isAway }}" hint-placeholder-val="{{ false }}"><dc-import name="Elsewhere" fit="flow" bar="{{ groups }}" kind="{{ w.kind }}" where="{{ w.where }}" detail="{{ w.detail }}" url="{{ w.url }}" on-back="{{ w.onBack }}" on-continue="{{ w.onContinue }}" hint-size="100%,900px"></dc-import></sc-if>
<div data-proto="screens"><span>Canvas only ·</span><a href="BookPage.dc.html">The book page alone</a><a href="Widths.dc.html">The book page at 390, 820, 1024 and 1440</a><a href="Elsewhere.dc.html">The stand-in for another job's screen</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2210}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = window.BK.initial('g');
    this.a = window.BK.api(this);
  }
  renderVals() {
    const BK = window.BK, s = this.state;
    const none = { kind: 'chapter', where: '', detail: '', url: '', onBack: null, onContinue: null };
    return {
      groups: BK.bar(this, this.a),
      theme: s.theme || 'light',
      onBook: !s.away,
      isAway: !!s.away,
      p: BK.pageProps(this, this.a),
      w: s.away ? BK.awayProps(this, this.a) : none,
    };
  }
}
</script>
</body>
</html>
