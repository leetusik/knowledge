<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Component — suspended, with undo</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kb/tokens.css">
<link rel="stylesheet" href="reader.css">
<link rel="stylesheet" href="quiz.css">
<link rel="stylesheet" href="annot.css">
<link rel="stylesheet" href="review.css">
<script src="reader.js"></script>
<script src="annot.js"></script>
<script src="review.js"></script>
</head>
<body>
<x-dc>
<div class="rd-board">
<p class="rd-board__title">Suspended, with undo</p>
<p class="rd-board__lead">Suspend sits at the foot of every card, beside the way back into the chapter (open question 5). The card leaves the queue at once, and the signed undo line says what suspending did, with Undo.</p>
<div class="rd-board__rows"><sc-for list="{{ groups }}" as="g" hint-placeholder-count="3"><div class="rd-board__group"><p class="rd-board__rowtitle">{{ g.title }}</p><div class="rd-row"><sc-for list="{{ g.cells }}" as="x" hint-placeholder-count="4"><div class="rd-cell"><p class="rd-cap">{{ x.cap }}</p><div class="{{ x.box }}"><dc-import name="Toast" text="{{ x.v }}" theme="{{ g.theme }}" uid="{{ x.uid }}" hint-size="100%,560px"></dc-import></div></div></sc-for></div></div></sc-for></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1400, "height": 698}}'>
class Component extends DCLogic {
  renderVals() {
    const RV = window.RV;
    const THEMES = [['light', 'Light'], ['dark', 'Dark'], ['sepia', 'Sepia']];
    const cells = (theme) => {

      return [
        { cap: 'A quiz card suspended', v: 'Card suspended. It leaves your reviews and keeps its history.' },
        { cap: 'A highlight card suspended', v: 'Card suspended, and Review this is off on its highlight.' },
      ];
    };
    return {
      groups: THEMES.map((t) => ({ title: t[1], theme: t[0], cells: cells(t[0]).map((x, i) => Object.assign({ box: 'rd-stage rv-cellbox' + (x.phone ? ' rv-cellbox--phone' : x.sheet ? ' rv-cellbox--sheet' : ''), uid: 'b-' + t[0] + '-' + i }, x)) })),
    };
  }
}
</script>
</body>
</html>
